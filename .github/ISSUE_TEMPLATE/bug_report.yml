name: "🐛 Bug Report"
description: "File an issue for unexpected behavior, error responses, or regression"
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 🔍 Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened unexpectedly...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 🪜 Steps to Reproduce
      description: Provide the exact steps or curl command to reproduce the issue.
      placeholder: |
        1. Send POST request to `/api/v1/urls` with body `...`
        2. Execute GET `/{shortCode}`
        3. Observe unexpected HTTP 500 error
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: 🎯 Expected vs Actual Behavior
      description: What did you expect to happen vs what actually occurred?
      placeholder: |
        - Expected: HTTP 404 ProblemDetail returned
        - Actual: Unhandled NullPointerException leading to HTTP 500
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 📄 Relevant Logs / Stack Trace
      description: Paste any server logs, stack traces, or metrics here.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: 🚨 Severity
      options:
        - "priority:critical (Production outage / data loss)"
        - "priority:high (Core functionality broken)"
        - "priority:medium (Non-blocking bug / edge case)"
        - "priority:low (Minor glitch / typo)"
    validations:
      required: false
