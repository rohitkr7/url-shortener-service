server:
  port: 9090

spring:
  application:
    name: url-shortener-service

  datasource:
    url: jdbc:postgresql://localhost:5432/shortener_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only verifies
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    cache-names:
      - urls
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=1h

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics